<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Evento — evenMap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Cadastrar Evento</h2>

        <input class="input" type="text" placeholder="Nome do evento">
        <input class="input" type="date">
        <input class="input" type="time">
        <input class="input" type="text" placeholder="Local">
        <textarea class="input" placeholder="Descrição"></textarea>
        <input class="input" type="number" placeholder="Limite de participantes">

        <button class="btn" onclick="alert('Evento cadastrado (simulação)')">Salvar evento</button>
    </div>
</div>

</body>
</html>
