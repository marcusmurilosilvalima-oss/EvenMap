<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Eventos</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="calendar-section">
        <div class="calendar-container">
            <div class="calendar-title">
                <h1>
                    MURAL<br>
                    <span class="highlight">DE<br>EVENTOS</span>
                </h1>
            </div>
            
            <div class="calendar-grid">
                <div class="calendar-cell"></div>
                <div class="calendar-cell"></div>
                <div class="calendar-cell"></div>
                <div class="calendar-cell"></div>
                <div class="calendar-cell"></div>
                <div class="calendar-cell"></div>
                <div class="calendar-cell"></div>
                <div class="calendar-cell"></div>
                <div class="calendar-cell"></div>
                <div class="calendar-cell"></div>
                <div class="calendar-cell"></div>
                <div class="calendar-cell"></div>
                <div class="calendar-cell"></div>
                <div class="calendar-cell"></div>
                <div class="calendar-cell"></div>
            </div>
        </div>
    </div>

    <div class="actions-section">
        <button class="btn btn-primary" onclick="window.location.href='./cadastrar_evento/event_registration_form.html'">
            Cadastrar Evento
        </button>
        
        <button class="btn btn-secondary" onclick="window.location.href='./eventos_cadastrados/events_list_page.html'">
            Participar de Evento
        </button>
    </div>

    <div class="logo">
        <div class="logo-icon">
            <img src="logo-ifpa-belem.png" alt="logo-ifpa" width="160">
        </div>
    </div>
</body>
</html>
